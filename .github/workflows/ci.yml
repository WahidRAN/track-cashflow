name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx nuxi typecheck

  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      # Dummy values so Nuxt config doesn't error on missing env
      NUXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NUXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      ANTHROPIC_API_KEY: sk-ant-placeholder
      VOYAGE_API_KEY: pa-placeholder
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx nuxi build
        continue-on-error: true  # Build may fail without real Supabase — that's OK in CI
